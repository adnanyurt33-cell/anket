<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Anket Oluştur - Anket Asistanı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }
        .create-container {
            max-width: 900px;
            margin: 2rem auto;
            background: white;
            border-radius: var(--radius);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            padding: 2rem;
        }
        .create-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        .create-header h1 { font-size: 1.5rem; font-weight: 700; }
        .btn-back { color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; font-weight: 500; }
        .btn-back:hover { color: var(--primary-color); }
    </style>
</head>
<body>
    
    <div class="create-container">
        <div class="create-header">
            <a href="index.html" class="btn-back"><i class="ri-arrow-left-line"></i> Panele Dön</a>
            <h1>Yeni Anket Oluştur</h1>
            <button class="btn btn-primary" id="btn-save-survey">
                <i class="ri-save-line"></i> Oluştur ve Yayınla
            </button>
        </div>

        <div class="form-group" style="margin-bottom: 2rem;">
            <label for="survey-title" style="font-weight: 500;">Anket Başlığı</label>
            <input type="text" id="survey-title" class="input-wrapper input" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius); font-size: 1rem;" placeholder="Örn: Müşteri Memnuniyet Anketi">
        </div>
        
        <div class="switch-group" style="padding: 1.25rem; margin-bottom: 2rem; border: 1px solid var(--border-color);">
            <div>
                <div style="font-weight: 500; font-size: 1rem;">Ad Soyad Zorunlu Mu?</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Katılımcılardan isim isteyin. Yoksa anket anonim olur.</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="require-name">
                <span class="slider"></span>
            </label>
        </div>

        <div style="margin-bottom: 1rem; font-weight: 600; font-size: 1.125rem; display:flex; justify-content: space-between; align-items:center;">
            Anket Soruları
            <button class="btn btn-outline btn-sm" style="padding: 0.4rem 0.8rem;" id="btn-add-question">
                <i class="ri-add-line"></i> Yeni Soru Ekle
            </button>
        </div>
        
        <div id="questions-container" style="display: flex; flex-direction: column; gap: 1.5rem;">
            <!-- Dinamik Sorular Buraya Eklenecek -->
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/js/supabase.js"></script>
    <script src="./assets/js/create.js"></script>
</body>
</html>
